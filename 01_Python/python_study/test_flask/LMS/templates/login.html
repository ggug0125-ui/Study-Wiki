{% extends "layout.html" %}
{% block title %}로그인 | LHJ System{% endblock %}

{% block head_extra %}
<style>
  /* ✅ 로그인 페이지 중앙 정렬(헤더/푸터 유지) */
  main.page{
    min-height: calc(100vh - 140px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ✅ 로그인 전용: login- 접두어만 사용 (충돌 방지) */
  :root{
    --login-card:#ffffff;
    --login-ink:#111827;
    --login-muted:#6b7280;
    --login-p1:#6d5dfc;
    --login-p2:#7c3aed;
    --login-shadow: 0 18px 45px rgba(16,24,40,.10);
    --login-shadow2: 0 12px 25px rgba(124,58,237,.18);
    --login-radius: 22px;
  }

  .login-card{
    width: min(430px, 100%);
    background: var(--login-card);
    border: 1px solid rgba(233,236,244,.9);
    border-radius: var(--login-radius);
    box-shadow: var(--login-shadow);
    padding: 34px 32px 28px;
    text-align:center;
  }

  .login-app-icon{
    width:78px; height:78px;
    border-radius: 22px;
    margin: 0 auto 14px;
    display:grid; place-items:center;
    background: linear-gradient(135deg, var(--login-p1), var(--login-p2));
    box-shadow: var(--login-shadow2);
    position: relative;
    overflow:hidden;
  }
  .login-app-icon::before{
    content:"";
    position:absolute; inset:-30px -20px auto auto;
    width:90px; height:90px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.45), transparent 60%);
    transform: rotate(20deg);
  }
  .login-app-icon span{
    position:relative;
    font-weight: 900;
    color:white;
    letter-spacing:-.5px;
    line-height:1.05;
    font-size: 14px;
    opacity:.95;
  }

  .login-title{
    margin: 8px 0 8px;
    font-size: 28px;
    letter-spacing:-.8px;
    color: var(--login-ink);
    font-weight: 900;
  }
  .login-sub{
    margin:0 0 22px;
    color: var(--login-muted);
    font-weight: 700;
    font-size: 14px;
  }

  .login-field{ text-align:left; margin-top: 14px; }
  .login-label{
    display:block;
    font-weight: 900;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .login-input{
    width:100%;
    border: 1px solid rgba(233,236,244,.95);
    background: #f7f8fd;
    border-radius: 14px;
    padding: 14px 14px;
    outline:none;
    font-size: 14px;
    transition:.15s ease;
  }
  .login-input:focus{
    background:#fff;
    border-color: rgba(109,93,252,.55);
    box-shadow: 0 0 0 4px rgba(109,93,252,.12);
  }

  .login-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin: 14px 0 16px;
    color: var(--login-muted);
    font-weight: 700;
    font-size: 13px;
  }
  .login-check{ display:flex; align-items:center; gap: 8px; user-select:none; }
  .login-check input{ width:16px; height:16px; accent-color: var(--login-p1); }

  .login-link{
    color: var(--login-p1);
    text-decoration:none;
    font-weight: 900;
  }
  .login-link:hover{ text-decoration:underline; }

  .login-btn{
    width:100%;
    border:0;
    cursor:pointer;
    border-radius: 14px;
    padding: 14px 16px;
    font-weight: 900;
    font-size: 15px;
    color:white;
    background: linear-gradient(135deg, var(--login-p1), var(--login-p2));
    box-shadow: 0 14px 25px rgba(124,58,237,.22);
    transition:.15s ease;
  }
  .login-btn:hover{ transform: translateY(-1px); }

  .login-bottom{
    margin-top: 18px;
    color: var(--login-muted);
    font-weight: 800;
    font-size: 13px;
  }
</style>
{% endblock %}

{% block content %}
  <div class="login-card">
    <div class="login-app-icon" aria-hidden="true">
      <span>LHJ<br>System</span>
    </div>

    <div class="login-title">로그인</div>
    <p class="login-sub">LHJ System에 오신 것을 환영합니다</p>

    <form method="post" action="/login">
      <div class="login-field">
        <label class="login-label" for="uid">아이디</label>
        <input class="login-input" id="uid" name="uid" type="text"
               placeholder="아이디를 입력하세요" autocomplete="username" required>
      </div>

      <div class="login-field">
        <label class="login-label" for="upw">비밀번호</label>
        <input class="login-input" id="upw" name="upw" type="password"
               placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
      </div>

      <div class="login-row">
        <label class="login-check">
          <input type="checkbox" name="remember">
          로그인 상태 유지
        </label>
        <a class="login-link" href="/password">비밀번호 찾기</a>
      </div>

      <button class="login-btn" type="submit">로그인</button>
    </form>

    <div class="login-bottom">
      계정이 없으신가요? <a class="login-link" href="/join">회원가입</a>
    </div>
  </div>
{% endblock %}
